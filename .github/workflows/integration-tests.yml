name: Integration Tests

on:
  push:
    branches: [ main, master, develop, copilot/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Run integration tests
        run: node tests/integration.test.js
        timeout-minutes: 5
      
      - name: Run simple startup test
        run: node test-simple.js
        timeout-minutes: 1
      
      - name: Check for vulnerabilities
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mcp-industrial-scout:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 15
      
      - name: Test Docker image
        run: |
          echo "Testing Docker image startup..."
          timeout 10s docker run mcp-industrial-scout:test 2>&1 | tee docker-output.log || true
          if grep -q "running on stdio" docker-output.log; then
            echo "✅ Docker image started successfully"
          else
            echo "❌ Docker image failed to start"
            exit 1
          fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript compilation
        run: npm run build
      
      - name: Check for TypeScript errors
        run: npx tsc --noEmit
      
      - name: List built files
        run: ls -lh dist/

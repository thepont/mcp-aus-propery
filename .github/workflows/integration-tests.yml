name: Integration Tests

on:
  push:
    branches: [ main, master, develop, copilot/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # Unit tests - no network required
  unit-tests:
    name: Unit Tests (No Network)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Run unit tests
        run: node tests/unit/framework.test.js
        timeout-minutes: 2
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-node-${{ matrix.node-version }}
          path: |
            dist/
            package.json

  # Integration tests - MCP server (no network)
  integration-tests-mcp:
    name: Integration Tests - MCP Server
    runs-on: ubuntu-latest
    needs: unit-tests
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Run MCP integration tests
        run: node tests/integration/mcp-server.test.js
        timeout-minutes: 5

  # CRITICAL: Network tests - validates ALL website assumptions
  integration-tests-network:
    name: Integration Tests - Website Validation (WITH NETWORK)
    runs-on: ubuntu-latest
    needs: unit-tests
    
    strategy:
      matrix:
        node-version: [22.x]  # Only test on latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright with dependencies
        run: npx playwright install chromium --with-deps
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Test network connectivity
        run: |
          echo "Testing network access..."
          curl -I https://www.google.com || echo "Google blocked"
          curl -I https://registry.npmjs.org || echo "NPM registry blocked"
          curl -I https://www.cbre.com.au || echo "CBRE blocked"
          curl -I https://www.cameron.com.au || echo "Cameron blocked"
      
      - name: Run website assumption validation tests
        id: website-tests
        run: node tests/integration/website-assumptions.test.js
        timeout-minutes: 10
        continue-on-error: true
      
      - name: Run API discovery tests
        run: node tests/network/api-discovery.test.js
        timeout-minutes: 10
        continue-on-error: true
      
      - name: Run scout implementation tests
        run: node tests/network/scout-implementation.test.js
        timeout-minutes: 10
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-results
          path: |
            tests/network/api-discoveries.json
            tests/integration/website-validation-results.json
      
      - name: Comment on PR with network test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🌐 Network Test Results\n\n';
            
            try {
              const results = JSON.parse(fs.readFileSync('tests/integration/website-validation-results.json', 'utf8'));
              
              comment += '### CBRE Validations\n';
              comment += `- Assumptions tested: ${results.cbre.assumptions.length}\n`;
              const cbreValid = results.cbre.assumptions.filter(a => a.validated).length;
              comment += `- Passed: ${cbreValid}/${results.cbre.assumptions.length}\n\n`;
              
              comment += '### Cameron Validations\n';
              comment += `- Assumptions tested: ${results.cameron.assumptions.length}\n`;
              const camValid = results.cameron.assumptions.filter(a => a.validated).length;
              comment += `- Passed: ${camValid}/${results.cameron.assumptions.length}\n\n`;
              
              if (cbreValid > 0 || camValid > 0) {
                comment += '✅ **Some network tests passed! Websites are accessible in CI.**\n';
              } else {
                comment += '❌ **All network tests failed - DNS may be blocked in CI.**\n';
              }
            } catch (e) {
              comment += '⚠️ Could not read test results - tests may not have run.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if website tests failed
        if: steps.website-tests.outcome == 'failure'
        run: |
          echo "⚠️ Website validation tests failed"
          echo "This means:"
          echo "  - Websites may not be accessible (DNS blocked)"
          echo "  - OR URLs are incorrect"
          echo "  - OR Selectors don't match actual HTML"
          echo "  - OR Implementation is broken"
          echo ""
          echo "Check artifacts for detailed results"
          exit 1

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mcp-industrial-scout:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 15
      
      - name: Test Docker image
        run: |
          echo "Testing Docker image startup..."
          timeout 10s docker run mcp-industrial-scout:test 2>&1 | tee docker-output.log || true
          if grep -q "running on stdio" docker-output.log; then
            echo "✅ Docker image started successfully"
          else
            echo "❌ Docker image failed to start"
            exit 1
          fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript compilation
        run: npm run build
      
      - name: Check for TypeScript errors
        run: npx tsc --noEmit
      
      - name: List built files
        run: ls -lh dist/
